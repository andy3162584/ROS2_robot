ekf_filter_node:
  ros__parameters:
    use_sim_time: false
    frequency: 30.0  # 輸出 TF 的頻率
    sensor_timeout: 0.1
    two_d_mode: true # 2D 機器人請設為 true
    
    # 座標系設定
    map_frame: map              
    odom_frame: odom            
    base_link_frame: base_link  
    world_frame: odom           # EKF 負責 odom -> base_link

    # 1. 里程計輸入設定 (由你的 odom_publisher 提供)
    odom0: /odom
    odom0_config: [true,  true,  false, # x, y, z
                   false, false, true,  # roll, pitch, yaw
                   false, false, false, # vx, vy, vz
                   false, false, false, # vroll, vpitch, vyaw
                   false, false, false] # ax, ay, az
    odom0_relative: true

    # 2. IMU 輸入設定 (由你的 IMU 節點提供)
    imu0: /imu/data_raw
    imu0_config: [false, false, false,
                  false, false, true,  # 只要 IMU 的 Yaw (角度)
                  false, false, false,
                  false, false, true,  # 只要 IMU 的 角速度
                  false, false, false]
    imu0_relative: true
    imu0_remove_gravitational_acceleration: true